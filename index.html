<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تقرير صناعيو المستقبل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#2a3590',    // Dark Blue
                primary: '#3d59a5', // Medium Blue
                accent: '#837cb9',  // Lavender/Purple
                light: '#f8f9fa'    // Off-white
              }
            },
            animation: {
              'blob': 'blob 7s infinite',
              'fade-in': 'fadeIn 0.3s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: transparent;
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      .animated-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(-45deg, #0f1125, #2a3590, #6c429e, #3d59a5);
        background-size: 400% 400%;
        animation: gradientAnimation 12s ease infinite;
        z-index: -3;
      }
      
      @keyframes gradientAnimation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .glow-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        pointer-events: none;
      }

      .glow-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.6;
        animation: floatBlob 20s infinite ease-in-out alternate;
      }

      .glow-blob-1 {
        top: -10%;
        left: -10%;
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, rgba(131, 124, 185, 0.5) 0%, transparent 70%);
      }

      .glow-blob-2 {
        bottom: -10%;
        right: -10%;
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, rgba(61, 89, 165, 0.5) 0%, transparent 70%);
        animation-delay: -10s;
      }

      @keyframes floatBlob {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 30px) scale(1.1); }
      }

      #network-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        display: block;
      }
      
      /* --- PRINT STYLES (Controlled A4 Layout) --- */
      @media print {
        @page {
          size: A4;
          margin: 0 !important;
        }

        html, body {
          width: 210mm;
          height: auto !important;
          min-height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          background-color: white !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
          overflow: visible !important; /* Changed to visible to allow flow, but page breaks control it */
        }

        /* Hide screen elements */
        .no-print, .animated-bg, .glow-layer, #network-canvas, .screen-only-container { 
          display: none !important; 
        }

        .print-only-container {
            display: block !important;
            width: 100%;
        }

        /* Generic Print Page */
        .print-page {
            width: 210mm;
            height: 296.5mm; /* Exact height slightly less than 297mm to prevent overflow */
            position: relative;
            background: white;
            overflow: hidden; /* Cut content if it overflows the page */
            padding: 0;
            margin: 0;
            
            /* Flex layout for sticky footer */
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            /* FORCE PAGE BREAK AFTER EACH PAGE BY DEFAULT */
            page-break-after: always; 
            break-after: page;
        }

        /* CRITICAL FIX: The LAST page must NOT have a break after it */
        .print-page:last-child, 
        .print-page.last-page {
            page-break-after: auto !important;
            break-after: auto !important;
            margin-bottom: 0 !important;
            border-bottom: none !important;
        }
        
        .print-content-safe-area {
            padding: 10mm 10mm 0mm 10mm;
            height: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }

        /* Reset global shadows/filters for print performance */
        * {
          box-shadow: none !important;
          text-shadow: none !important;
          filter: none !important;
          backdrop-filter: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "mammoth": "https://esm.sh/mammoth@^1.11.0"
  }
}
</script>
</head>
  <body>
    <div class="animated-bg"></div>
    <div class="glow-layer">
        <div class="glow-blob glow-blob-1"></div>
        <div class="glow-blob glow-blob-2"></div>
    </div>
    <canvas id="network-canvas"></canvas>
    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>

    <script>
      (function() {
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const particleCount = 100;
        const connectionDistance = 150;
        const moveSpeed = 0.5; 

        class Particle {
          constructor(x, y) {
            this.x = x !== undefined ? x : Math.random() * width;
            this.y = y !== undefined ? y : Math.random() * height;
            this.vx = (Math.random() - 0.5) * moveSpeed;
            this.vy = (Math.random() - 0.5) * moveSpeed;
            this.size = Math.random() * 2 + 1;
          }
          update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;
          }
          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; 
            ctx.fill();
          }
        }

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            particles = [];
            for (let i = 0; i < particleCount; i++) {
                // Ensure pure random distribution across the entire current width/height
                particles.push(new Particle(Math.random() * width, Math.random() * height));
            }
        }

        function resize() {
            const oldWidth = width;
            const oldHeight = height;
            
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // If we have existing particles, scale their positions to match new screen size
            // This prevents them from clumping in the corner if screen expands
            if (particles.length > 0 && oldWidth > 0 && oldHeight > 0) {
                particles.forEach(p => {
                    p.x = p.x * (width / oldWidth);
                    p.y = p.y * (height / oldHeight);
                });
            } else {
                // First run or invalid old state
                init();
            }
        }

        function animate() {
          ctx.clearRect(0, 0, width, height);
          for (let i = 0; i < particles.length; i++) {
            let p1 = particles[i];
            p1.update();
            p1.draw();
            for (let j = i + 1; j < particles.length; j++) {
              let p2 = particles[j];
              let dx = p1.x - p2.x;
              let dy = p1.y - p2.y;
              let distance = Math.sqrt(dx * dx + dy * dy);
              if (distance < connectionDistance) {
                ctx.beginPath();
                let opacity = 1 - (distance / connectionDistance);
                ctx.strokeStyle = `rgba(180, 200, 255, ${opacity * 0.4})`; 
                ctx.lineWidth = 1;
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }
          }
          requestAnimationFrame(animate);
        }
        
        // Listen for resize
        window.addEventListener('resize', resize);
        
        // Initial setup
        init();
        animate();
      })();
    </script>
  </body>
</html>
