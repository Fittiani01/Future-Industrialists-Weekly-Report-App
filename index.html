<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تقرير صناعيو المستقبل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#2a3590',    // Dark Blue
                primary: '#3d59a5', // Medium Blue
                accent: '#837cb9',  // Lavender/Purple
                light: '#f8f9fa'    // Off-white
              }
            },
            animation: {
              'blob': 'blob 7s infinite',
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'zoom-in': 'zoomIn 0.3s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              zoomIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: transparent; /* Changed from dark color to transparent */
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      /* 1. Strong Moving Gradient Background - High Contrast */
      .animated-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* Lighter, more vibrant gradient to be visible */
        background: linear-gradient(-45deg, #0f1125, #2a3590, #6c429e, #3d59a5);
        background-size: 400% 400%;
        animation: gradientAnimation 12s ease infinite;
        z-index: -3; /* Adjusted z-index */
      }
      
      @keyframes gradientAnimation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* 2. Glowing Orbs Overlay */
      .glow-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        pointer-events: none;
      }

      .glow-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.6; /* Increased opacity */
        animation: floatBlob 20s infinite ease-in-out alternate;
      }

      .glow-blob-1 {
        top: -10%;
        left: -10%;
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, rgba(131, 124, 185, 0.5) 0%, transparent 70%);
      }

      .glow-blob-2 {
        bottom: -10%;
        right: -10%;
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, rgba(61, 89, 165, 0.5) 0%, transparent 70%);
        animation-delay: -10s;
      }

      @keyframes floatBlob {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 30px) scale(1.1); }
      }

      /* 3. Particle Network Canvas - Very Visible */
      #network-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1; /* Top of background stack */
        display: block;
      }
      
      /* Print styles */
      @media print {
        .no-print { display: none !important; }
        .print-break-inside { break-inside: avoid; }
        body { background-color: white !important; -webkit-print-color-adjust: exact; }
        .animated-bg, .glow-layer, #network-canvas { display: none !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "mammoth": "https://esm.sh/mammoth@1.6.0"
  }
}
</script>
</head>
  <body>
    <!-- Background Layers -->
    <div class="animated-bg"></div>
    <div class="glow-layer">
        <div class="glow-blob glow-blob-1"></div>
        <div class="glow-blob glow-blob-2"></div>
    </div>
    <canvas id="network-canvas"></canvas>
    
    <div id="root"></div>

    <!-- Particle Network Script -->
    <script>
      (function() {
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Network Configuration
        const particleCount = 100;
        const connectionDistance = 160;
        const moveSpeed = 0.7; 

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width;
          canvas.height = height;
        }

        class Particle {
          constructor() {
            // Start from the center with some randomness
            this.x = (width / 2) + (Math.random() - 0.5) * 200;
            this.y = (height / 2) + (Math.random() - 0.5) * 200;
            
            // Velocity explodes outwards initially or flows organically
            this.vx = (Math.random() - 0.5) * moveSpeed;
            this.vy = (Math.random() - 0.5) * moveSpeed;
            this.size = Math.random() * 2 + 1.5;
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;

            // Bounce off edges
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;
          }

          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            // Bright white particles for visibility against gradient
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
          }
        }

        function init() {
          resize();
          particles = [];
          for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
          }
        }

        function animate() {
          ctx.clearRect(0, 0, width, height);
          
          for (let i = 0; i < particles.length; i++) {
            let p1 = particles[i];
            p1.update();
            p1.draw();

            // Connect lines
            for (let j = i + 1; j < particles.length; j++) {
              let p2 = particles[j];
              let dx = p1.x - p2.x;
              let dy = p1.y - p2.y;
              let distance = Math.sqrt(dx * dx + dy * dy);

              if (distance < connectionDistance) {
                ctx.beginPath();
                // Opacity based on distance
                let opacity = 1 - (distance / connectionDistance);
                // White/Blue lines
                ctx.strokeStyle = `rgba(200, 220, 255, ${opacity * 0.5})`; 
                ctx.lineWidth = 1;
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }
          }
          requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
        animate();
      })();
    </script>
  </body>
</html>
